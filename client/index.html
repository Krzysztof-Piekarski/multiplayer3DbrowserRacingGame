<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>3D browser racer</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lobby" class="lobby-state">
        <div class="lobby-content">
            <h1>CyberRace</h1>
            <div class="players-count">
                <p>Players online: <span id="players-count-text"><strong>0</strong></span></p>
            </div>
            <button id="start-button" class="btn-start" disabled>Start race</button>
            <p id="info-text">You need 2 players to start</p>
        </div>
    </div>

    <div id="touch-controls">
        <div class="throttle-controls">
            <button id="forward-btn">▲</button>
            <button id="backward-btn">▼</button>
        </div>

        <div class="steer-controls">
            <button id="left-btn">◀</button>
            <button id="right-btn">▶</button>
        </div>
    </div>

    <div id="game-container"></div>

    <div id="hud">
        <div class="lap-statistics">
            <div id="road-progress-bar">
                <div id="road-progress-fill"></div>
            </div>

            <div id="lap-text">LAP: 1 / 2</div>

            <div id="ranking"></div>
        </div>

        <div id="speed-bar">
            <div id="speed-fill"></div>
        </div>
    </div>

    <script type="module" src="src/init.js"></script>
</html>
