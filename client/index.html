<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D browser racer</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>

    <div id="hud">

        <div id="speed-bar">

        </div>
    </div>

    <script type="module" src="src/init.js"></script>
</html>
